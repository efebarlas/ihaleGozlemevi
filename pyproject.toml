[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihale"
version = "0.1.0"
description = "Ihale Gozlemevi: public-interest watchdog over Turkish public procurement (EKAP)"
requires-python = ">=3.12"
dependencies = ["ihalent[bulletin]==0.5.1", "pdfplumber", "pypdf", "jinja2"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]
analysis = ["matplotlib==3.9.2", "numpy"]   # scripts/stage1_findings.py only

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
