[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihale"
version = "0.1.0"
description = "Ihale Gozlemevi: public-interest watchdog over Turkish public procurement (EKAP)"
requires-python = ">=3.12"
dependencies = ["requests", "pdfplumber", "pypdf"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
