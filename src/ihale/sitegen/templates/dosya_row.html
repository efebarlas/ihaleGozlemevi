<li class="row">
  {% if r.href %}<a class="rt" href="{{ r.href }}">{{ r.title }}</a>{% else %}<span class="rt">{{ r.title }}</span>{% endif %}
  <span class="rm">{{ r.date }} · {% if r.who_href %}<a href="{{ r.who_href }}">{{ r.who }}</a>{% else %}{{ r.who }}{% endif %}{% if r.second %} · {{ r.second }}{% endif %}</span>
  <span class="rb">{{ r.bedel }}</span>
  {% if r.flags %}<ul class="flags small">{% for f in r.flags %}<li class="flag">{{ f }}</li>{% endfor %}</ul>{% endif %}
</li>
